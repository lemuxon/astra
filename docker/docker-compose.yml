# =========================================================
# ASTRA v9.0 — Docker Compose
# Servisler:
#   astra      : Ana bot (production)
#   redis      : Event queue backend (opsiyonel)
#   prometheus : Metrics toplama (opsiyonel)
#   grafana    : Görselleştirme (opsiyonel)
# =========================================================

version: "3.9"

services:

  # ── Ana Bot ─────────────────────────────────────────────
  astra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: astra_v9
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../saved_models:/app/saved_models
      - ../data:/app/data
      - ../logs:/app/logs
    # v55 GÜVENLİK: Dashboard bakiye/pozisyon/PnL gösterir, Prometheus metrikleri
    # hesap finansallarını yayınlar. İkisi de VARSAYILAN olarak yalnızca
    # localhost'a bağlanır. Uzaktan erişim gerekiyorsa reverse-proxy + TLS +
    # kimlik doğrulama arkasına alın; "0.0.0.0:8080:8080" yazmayın.
    ports:
      - "127.0.0.1:8080:8080"    # Dashboard (yalnızca localhost)
      - "127.0.0.1:9090:9090"    # Prometheus metrics (yalnızca localhost)
    depends_on:
      - redis
      - timescaledb
    mem_limit: 4g
    cpus: 2.0
    environment:
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_ENABLED=true
      - DB_BACKEND=timescale
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=astra
      - DB_USER=astra
      # v55 GÜVENLİK: Sabit şifre dosyadan kaldırıldı. Değer .env'den gelir.
      # .env'de DB_PASSWORD tanımlı değilse compose başlatmayı reddeder.
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env dosyasinda tanimlanmali}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD .env dosyasinda tanimlanmali}
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8080', timeout=3)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  # ── TimescaleDB (v10) ────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: astra_timescaledb
    restart: unless-stopped
    # v55 GÜVENLİK: Port artık HOST'a açılmıyor — yalnızca compose iç ağından
    # erişilebilir. Eskiden "5432:5432" ile tüm arayüzlere yayınlanıyordu;
    # tahmin edilebilir şifreyle birleşince doğrudan DB ele geçirme vektörüydü.
    # Host'tan erişim gerekiyorsa: "127.0.0.1:5432:5432" (yalnızca localhost).
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=astra
      - POSTGRES_USER=astra
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env dosyasinda tanimlanmali}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Signal Node (v11 distributed) ───────────────────────
  signal_node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: astra_signal_node
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "nodes/signal_node.py"]
    volumes:
      - ../saved_models:/app/saved_models
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      - redis
      - timescaledb
    environment:
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - DB_BACKEND=timescale
      - DB_HOST=timescaledb
    # v55: Kaynak tavanı — kaçak bir ML eğitimi host'u tüketmesin
    mem_limit: 2g
    cpus: 1.5
    # v55: Healthcheck yoktu — asılı kalan node "sağlıklı" görünüyordu
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/logs/signal_node.log && find /app/logs/signal_node.log -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Execution Node (v11 distributed) ────────────────────
  execution_node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: astra_execution_node
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "nodes/execution_node.py"]
    volumes:
      - ../saved_models:/app/saved_models
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      - redis
      - timescaledb
      - signal_node
    environment:
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - DB_BACKEND=timescale
      - DB_HOST=timescaledb
    # v55: Kaynak tavanı + healthcheck (bkz. signal_node)
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/logs/execution_node.log && find /app/logs/execution_node.log -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Redis (Event Queue) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: astra_redis
    restart: unless-stopped
    # v55 GÜVENLİK: Port HOST'a AÇILMIYOR + kimlik doğrulama ZORUNLU.
    # Eskiden "6379:6379" ile tüm arayüzlerde, requirepass OLMADAN
    # dinliyordu — firewall'suz bir VPS'te bu, fırsatçı taramaların
    # bilinen hedefidir (config tabanlı RCE, cron injection, cryptomining).
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD .env dosyasinda tanimlanmali}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: astra_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    profiles:
      - monitoring   # sadece --profile monitoring ile başlar

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: astra_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # v55 GÜVENLİK: sabit şifre kaldırıldı, .env'den gelir
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD .env dosyasinda tanimlanmali}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  timescaledb_data:
  redis_data:
  prometheus_data:
  grafana_data:
